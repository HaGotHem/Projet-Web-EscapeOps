name: EscapeOps check

on:
  push:
    paths:
      - "starter-kit/**"
      - ".github/workflows/starter-kit-check.yml"
  pull_request:
    paths:
      - "starter-kit/**"
      - ".github/workflows/starter-kit-check.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: escapeops
          MYSQL_USER: escapeops
          MYSQL_PASSWORD: escapeopspass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=15

    defaults:
      run:
        working-directory: starter-kit

    env:
      APP_ENV: test
      APP_DEBUG: "true"
      DB_TYPE: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: escapeops
      DB_USER: escapeops
      DB_PASSWORD: escapeopspass
      DB_CHARSET: utf8mb4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax
        run: |
          find public config routes src templates tests -name "*.php" -print0 \
            | xargs -0 -n1 php -l

      - name: Tests sans BDD
        run: composer test

      - name: Créer la base EscapeOps (schéma + seed)
        # Le client mysql lit lui-même les fichiers : une erreur SQL arrête l'étape.
        run: |
          mysql -h 127.0.0.1 -u escapeops -pescapeopspass --default-character-set=utf8mb4 escapeops \
            -e "SOURCE database/migrations/001_schema.sql; SOURCE database/seed.sql;"
          mysql -h 127.0.0.1 -u escapeops -pescapeopspass --default-character-set=utf8mb4 escapeops \
            -e "SELECT COUNT(*) AS salles FROM salle; SELECT COUNT(*) AS sessions FROM session;"

      - name: Tester la vitrine avec le vrai SGBD
        run: |
          composer serve > /tmp/escapeops-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/api/health > /dev/null; then
              break
            fi
            sleep 1
          done

          # La page d'accueil répond 200 et affiche les 3 salles du seed
          curl -fsS http://127.0.0.1:8080/ > /tmp/accueil.html
          grep -q 'Le Cabinet des Ombres' /tmp/accueil.html
          grep -q 'La Crypte de l&#039;Archiviste' /tmp/accueil.html
          grep -q 'Le Laboratoire Interdit' /tmp/accueil.html

          # Au moins un créneau publié s'affiche
          grep -q -E 'Libre|Réservé' /tmp/accueil.html

          # Une page inconnue renvoie 404
          code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/page-inexistante)
          test "$code" = "404"

      - name: Logs en cas d'échec
        if: failure()
        run: cat /tmp/escapeops-server.log || true
