name: EscapeOps check

on:
  push:
    paths:
      - "starter-kit/**"
      - ".github/workflows/starter-kit-check.yml"
  pull_request:
    paths:
      - "starter-kit/**"
      - ".github/workflows/starter-kit-check.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: escapeops
          MYSQL_USER: escapeops
          MYSQL_PASSWORD: escapeopspass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=15

    defaults:
      run:
        working-directory: starter-kit

    env:
      APP_ENV: test
      APP_DEBUG: "true"
      DB_TYPE: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: escapeops
      DB_USER: escapeops
      DB_PASSWORD: escapeopspass
      DB_CHARSET: utf8mb4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax
        run: |
          find public config routes src templates tests -name "*.php" -print0 \
            | xargs -0 -n1 php -l

      - name: Tests sans BDD
        run: composer test

      - name: Créer la base EscapeOps (schéma, vues, procédure, trigger, seed)
        # Le client mysql lit lui-même les fichiers : une erreur SQL arrête l'étape.
        # Import en root : avec le binlog actif, MySQL 8 refuse CREATE TRIGGER à un compte sans SUPER.
        run: |
          mysql -h 127.0.0.1 -u root -prootpass --default-character-set=utf8mb4 escapeops \
            -e "SOURCE database/migrations/001_schema.sql; SOURCE database/migrations/002_vues.sql; SOURCE database/migrations/003_procedures.sql; SOURCE database/migrations/004_triggers.sql; SOURCE database/seed.sql;"
          mysql -h 127.0.0.1 -u escapeops -pescapeopspass --default-character-set=utf8mb4 escapeops \
            -e "SELECT COUNT(*) AS salles FROM salle; SELECT COUNT(*) AS sessions FROM session; CALL sp_bilan_salle(3);"

      - name: Tester le SQL avancé (Q1) sur la vraie base
        run: composer test-bdd

      - name: Tester la vitrine avec le vrai SGBD
        run: |
          composer serve > /tmp/escapeops-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/api/health > /dev/null; then
              break
            fi
            sleep 1
          done

          # La page d'accueil répond 200 et affiche les 3 salles du seed
          curl -fsS http://127.0.0.1:8080/ > /tmp/accueil.html
          grep -q 'Le Cabinet des Ombres' /tmp/accueil.html
          grep -q 'La Crypte de l&#039;Archiviste' /tmp/accueil.html
          grep -q 'Le Laboratoire Interdit' /tmp/accueil.html

          # Au moins un créneau publié s'affiche
          grep -q -E 'Libre|Réservé' /tmp/accueil.html

          # Une page inconnue renvoie 404
          code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/page-inexistante)
          test "$code" = "404"

      - name: Tester connexion, rôles et réservation (S4, S5)
        run: |
          B=http://127.0.0.1:8080
          MDP=demo-escapeops-2026
          # code HTTP d'une requête ; la page reçue est gardée dans /tmp/r.html
          code() { curl -sS -o /tmp/r.html -w '%{http_code}' "$@"; }
          # jeton CSRF de la dernière page reçue
          jeton() { grep -o 'name="csrf" value="[a-f0-9]*"' /tmp/r.html | head -1 | sed 's/.*value="//;s/"//'; }

          # --- S4 : connexion ---
          test "$(code -c r.jar -b r.jar $B/connexion)" = "200"; T=$(jeton)
          test "$(code -c r.jar -b r.jar -d "email=camille.roux@archives-obscures.example&mot_de_passe=$MDP" $B/connexion)" = "403"   # sans jeton CSRF
          test "$(code -c r.jar -b r.jar --data-urlencode "csrf=$T" -d 'email=camille.roux@archives-obscures.example&mot_de_passe=faux' $B/connexion)" = "401"
          test "$(code -c r.jar -b r.jar --data-urlencode "csrf=$T" -d "email=jules.petit@archives-obscures.example&mot_de_passe=$MDP" $B/connexion)" = "401"   # compte désactivé
          test "$(code $B/responsable/sessions)" = "303"   # pas connecté : renvoyé vers /connexion
          test "$(code -c r.jar -b r.jar --data-urlencode "csrf=$T" -d "email=camille.roux@archives-obscures.example&mot_de_passe=$MDP" $B/connexion)" = "303"

          # --- S4 : rôles (Camille est responsable) ---
          test "$(code -c r.jar -b r.jar $B/responsable/sessions)" = "200"; T=$(jeton)
          test "$(code -c r.jar -b r.jar $B/gm/sessions)" = "403"
          test "$(code -c r.jar -b r.jar $B/admin/comptes)" = "403"

          # --- S5 : états d'une session ---
          code -c r.jar -b r.jar --data-urlencode "csrf=$T" -d 'etat=EN_COURS' $B/responsable/sessions/26/etat > /dev/null
          code -c r.jar -b r.jar $B/responsable/sessions/26 > /dev/null
          grep -q 'Démarrage impossible' /tmp/r.html   # E5 : pas de démarrage sans game master
          code -c r.jar -b r.jar --data-urlencode "csrf=$T" -d 'etat=EN_COURS' $B/responsable/sessions/25/etat > /dev/null
          code -c r.jar -b r.jar $B/responsable/sessions/25 > /dev/null
          grep -q '>En cours<' /tmp/r.html

          # --- S5 : création d'une session ---
          D=$(date -d '+5 day' +%Y-%m-%d)
          test "$(code -c r.jar -b r.jar --data-urlencode "csrf=$T" -d "id_salle=1&debut=${D}T15:00" $B/responsable/sessions)" = "303"
          test "$(code -c r.jar -b r.jar --data-urlencode "csrf=$T" -d "id_salle=1&debut=${D}T16:05" $B/responsable/sessions)" = "422"   # remise en état
          test "$(code -c r.jar -b r.jar --data-urlencode "csrf=$T" -d "id_salle=1&debut=2020-01-01T18:00" $B/responsable/sessions)" = "422"   # passé

          # --- S5 : réservation d'un groupe (session 30 : libre dans le seed) ---
          test "$(code -c g.jar -b g.jar $B/reserver/30)" = "200"; T=$(jeton)
          F='nom_groupe=Groupe CI&contact_nom=Test CI&contact_email=ci@exemple.test&conditions=1'
          test "$(code -c g.jar -b g.jar --data-urlencode "csrf=$T" -d "$F&nb_joueurs=7" $B/reserver/30)" = "422"   # au-delà de la capacité
          test "$(code -c g.jar -b g.jar --data-urlencode "csrf=$T" -d "$F&nb_joueurs=4" $B/reserver/30)" = "303"
          test "$(code -c g.jar -b g.jar $B/reserver/confirmation)" = "200"
          grep -q -E 'AO-[A-Z0-9]{8}' /tmp/r.html
          test "$(code -c g.jar -b g.jar --data-urlencode "csrf=$T" -d "$F&nb_joueurs=4" $B/reserver/30)" = "409"   # déjà pris
          test "$(code $B/reserver/1)" = "409"   # session passée

      - name: Logs en cas d'échec
        if: failure()
        run: cat /tmp/escapeops-server.log || true
